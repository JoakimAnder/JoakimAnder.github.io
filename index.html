<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joakim Andersson — Software Developer</title>
<meta name="description" content="Software developer focused on infra, backend, and .NET MAUI.">
<style>
  :root {
    /*
    ============ ATOMS ============
    */
    --color-primary-hue: 216;
    --color-warning-hue: 32;
    --color-success-hue: 144;
    --color-info-hue: 216;

    --color-neutral-50: hwb(var(--color-primary-hue) calc((100 - 4) * 100 / 100 * 1%) calc((100 - 100) * 1%));
    --color-neutral-100: hwb(var(--color-primary-hue) calc((100 - 4) * 96 / 100 * 1%) calc((100 - 96) * 1%));
    --color-neutral-150: hwb(var(--color-primary-hue) calc((100 - 4) * 88 / 100 * 1%) calc((100 - 88) * 1%));
    --color-neutral-300: hwb(var(--color-primary-hue) calc((100 - 4) * 64 / 100 * 1%) calc((100 - 64) * 1%));
    --color-neutral-500: hwb(var(--color-primary-hue) calc((100 - 4) * 40 / 100 * 1%) calc((100 - 40) * 1%));
    --color-neutral-700: hwb(var(--color-primary-hue) calc((100 - 4) * 30 / 100 * 1%) calc((100 - 30) * 1%));
    --color-neutral-850: hwb(var(--color-primary-hue) calc((100 - 4) * 14 / 100 * 1%) calc((100 - 14) * 1%));
    --color-neutral-900: hwb(var(--color-primary-hue) calc((100 - 4) * 12 / 100 * 1%) calc((100 - 12) * 1%));
    --color-neutral-950: hwb(var(--color-primary-hue) calc((100 - 4) * 8 / 100 * 1%) calc((100 - 8) * 1%));

    --color-primary-300: hwb(var(--color-primary-hue) calc((100 - 56) * 88 / 100 * 1%) calc((100 - 88) * 1%));
    --color-primary-500: hwb(var(--color-primary-hue) calc((100 - 88) * 88 / 100 * 1%) calc((100 - 88) * 1%));
    --color-primary-700: hwb(var(--color-primary-hue) calc((100 - 88) * 56 / 100 * 1%) calc((100 - 56) * 1%));
    --color-success-500: hwb(var(--color-success-hue) calc((100 - 88) * 88 / 100 * 1%) calc((100 - 88) * 1%));
    --color-warning-500: hwb(var(--color-warning-hue) calc((100 - 88) * 88 / 100 * 1%) calc((100 - 88) * 1%));
    --color-info-300: hwb(var(--color-info-hue) calc((100 - 56) * 88 / 100 * 1%) calc((100 - 88) * 1%));
    --color-info-700: hwb(var(--color-info-hue) calc((100 - 88) * 56 / 100 * 1%) calc((100 - 56) * 1%));

    /*
    ============ ELEMENTS ============
    */
    --color-bg: var(--color-neutral-100);
    --color-text: var(--color-neutral-900);
    --color-text-muted: var(--color-neutral-700);
    --color-text-link: var(--color-info-700);
    --color-border: var(--color-neutral-300);
    --color-border-accent: var(--color-primary-700);
    --color-bg-raised: var(--color-neutral-150);
    --color-bg-lowered: var(--color-neutral-50);
    --color-status-active: var(--color-success-500);
    --color-status-wip: var(--color-warning-500);
    --color-status-paused: var(--color-neutral-500);
    --color-status-done: var(--color-primary-500);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: var(--color-neutral-900);
      --color-text: var(--color-neutral-100);
      --color-text-muted: var(--color-neutral-300);
      --color-text-link: var(--color-info-300);
      --color-border: var(--color-neutral-700);
      --color-bg-raised: var(--color-neutral-850);
      --color-bg-lowered: var(--color-neutral-950);
      --color-border-accent: var(--color-primary-300);
      --color-status-done: var(--color-primary-500);
      --color-status-active: var(--color-success-500);
      --color-status-wip: var(--color-warning-500);
      --color-status-paused: var(--color-neutral-500);
    }
  }

  /*
  ============ OBJECTS ============
  */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  .tagline { color: var(--color-text-muted); margin: 0 0 24px; }
  .bio { margin: 0 0 24px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 40px; padding: 0; list-style: none; }
  a { color: var(--color-text-link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-muted); margin: 0 0 12px; font-weight: 600; }
  section { margin-bottom: 40px; }

  .now { border-left: 3px solid var(--color-border-accent); padding: 4px 0 4px 16px; }
  .now p { margin: 0; }

  .controls { display: grid; gap: 16px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .controls input {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--color-border); background: var(--color-bg-lowered); color: var(--color-text); font: inherit;
  }
  .chip {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--color-border);
    background: transparent; color: var(--color-text-muted); font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--color-text); color: var(--color-bg); border-color: var(--color-text); }

  .list { display: grid; gap: 10px; }
  .item {
    display: block; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--color-border); background: var(--color-bg-lowered); color: inherit;
  }
  .item:hover { border-color: var(--color-border-accent); text-decoration: none; }
  a:focus-visible, .chip:focus-visible, .controls input:focus-visible {
    outline: 2px solid var(--color-border-accent); outline-offset: 2px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .name { font-weight: 600; }
  .status { font-size: 0.75rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-status-paused); }
  .s-active .dot { background: var(--color-status-active); }
  .s-wip .dot { background: var(--color-status-wip); }
  .s-done .dot { background: var(--color-status-done); }
  .desc { color: var(--color-text-muted); font-size: 0.92rem; margin: 2px 0 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 0.72rem; color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: 6px; padding: 0 6px; }
  .empty { color: var(--color-text-muted); font-size: 0.9rem; padding: 12px 0; }
  footer { color: var(--color-text-muted); font-size: 0.85rem; border-top: 1px solid var(--color-border); padding-top: 20px; }
</style>
</head>
<body>
<main>

  <header>
    <h1>Joakim Andersson</h1>
    <p class="tagline">Software developer — .NET</p>
    <p class="bio">
      I build backend systems, cross-platform apps, and developer utils.
    </p>
    <ul class="links">
      <li><a href="https://github.com/JoakimAnder">GitHub</a></li>
      <li><a href="https://linkedin.com/in/joakim-ander">LinkedIn</a></li>
      <li><a href="mailto:contact@joakimander.dev">Email</a></li>
    </ul>
  </header>

  <section>
    <h2>Now</h2>
    <div class="now">
      <p>Refining my homelab.</p>
    </div>
  </section>

  <section>
    <h2>Projects &amp; links</h2>
    <div class="controls">
      <input id="q" type="search" placeholder="Search projects…" aria-label="Search projects">
      <div class="chips" role="group" aria-label="Filter by status">
      <button class="chip" data-status="all" aria-pressed="true">All</button>
      <button class="chip" data-status="active" aria-pressed="false">Active</button>
      <button class="chip" data-status="wip" aria-pressed="false">WIP</button>
      <button class="chip" data-status="paused" aria-pressed="false">Paused</button>
      <button class="chip" data-status="done" aria-pressed="false">Done</button>
      </div>
    </div>
    <div id="list" class="list"></div>
  </section>

  <footer>
    © <span id="year"></span> Joakim Andersson
  </footer>

</main>

<script>
  /* ------------------------------------------------------------
     EDIT THIS LIST. One object per link.
     status: "active" | "wip" | "paused" | "done"
     Links can be repos, docs, dashboards, notes — anything.
     ------------------------------------------------------------ */
  const projects = [
    {
      name: "Advent of Code solutions",
      url: "https://github.com/JoakimAnder/AdventOfCode",
      desc: "My solutions for the Advent of Code game.",
      status: "paused",
      tags: ["cli", ".net", "game"]
    },
    {
      name: "C# Toolbox",
      url: "https://github.com/JoakimAnder/Toolbox",
      desc: "A few helpful tools I often use in my C# projects.",
      status: "done",
      tags: ["library", "tool", ".net"]
    }
  ];
  /* ------------------------------------------------------------ */

  const labels = { active: "Active", wip: "WIP", paused: "Paused", done: "Done" };
  const listEl = document.getElementById("list");
  const qEl = document.getElementById("q");
  let statusFilter = "all";

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  function render() {
    const q = qEl.value.trim().toLowerCase();
    const shown = projects.filter(p => {
      if (statusFilter !== "all" && p.status !== statusFilter) return false;
      if (!q) return true;
      return [p.name, p.desc, ...(p.tags || [])].join(" ").toLowerCase().includes(q);
    });

    if (!shown.length) {
      listEl.innerHTML = '<div class="empty">Nothing matches.</div>';
      return;
    }

    listEl.innerHTML = shown.map(p => `
      <a class="item s-${esc(p.status)}" href="${esc(p.url)}" target="_blank" rel="noopener">
        <div class="row">
          <span class="name">${esc(p.name)}</span>
          <span class="status"><span class="dot"></span>${esc(labels[p.status] || p.status)}</span>
        </div>
        ${p.desc ? `<div class="desc">${esc(p.desc)}</div>` : ""}
        <div class="tags">${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </a>
    `).join("");
  }

  document.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      statusFilter = btn.dataset.status;
      document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b === btn));
      render();
    });
  });
  qEl.addEventListener("input", render);

  document.getElementById("year").textContent = new Date().getFullYear();
  render();
</script>
</body>
</html>
